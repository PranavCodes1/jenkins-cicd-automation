apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app
  namespace: pranav-cicd

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask-app

        image: pranavcodes1/jenkins-cicd-automation:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000
